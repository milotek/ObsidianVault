<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img"><rect width="780" height="360" rx="12" fill="#181825"/><text x="28" y="32" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#cdd6f4" opacity="1">The bottom-left row, left to right</text><text x="28" y="54" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#7f849c" opacity="1">Both OSes use these four keys. They fill them in opposite orders.</text><rect x="336" y="72" width="92" height="212" rx="8" fill="#f9e2af" opacity="0.09"/><rect x="336" y="72" width="92" height="212" rx="8" fill="none" stroke="#f9e2af" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/><text x="28" y="115.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" opacity="1">PC</text><rect x="160" y="86" width="96" height="58" rx="7" fill="#cba6f7" stroke="#313244" stroke-width="1"/><text x="208.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Ctrl</text><rect x="262" y="86" width="70" height="58" rx="7" fill="#fab387" stroke="#313244" stroke-width="1"/><text x="297.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Win</text><rect x="340" y="86" width="84" height="58" rx="7" fill="#94e2d5" stroke="#313244" stroke-width="1"/><text x="382.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Alt</text><rect x="432" y="86" width="250" height="58" rx="7" fill="#313244" stroke="#313244" stroke-width="1"/><text x="557.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cdd6f4">space</text><text x="28" y="225.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" opacity="1">Mac</text><rect x="160" y="196" width="96" height="58" rx="7" fill="#f38ba8" stroke="#313244" stroke-width="1"/><text x="208.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Ctrl</text><rect x="262" y="196" width="70" height="58" rx="7" fill="#94e2d5" stroke="#313244" stroke-width="1"/><text x="297.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Option</text><rect x="340" y="196" width="84" height="58" rx="7" fill="#cba6f7" stroke="#313244" stroke-width="1"/><text x="382.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#11111b">Cmd</text><rect x="432" y="196" width="250" height="58" rx="7" fill="#313244" stroke="#313244" stroke-width="1"/><text x="557.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cdd6f4">space</text><text x="382" y="162" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#f9e2af" opacity="1">least used</text><text x="382" y="272" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#f9e2af" opacity="1">used constantly</text><text x="28" y="312" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#7f849c" opacity="1">The same physical slot under your thumb: the modifier you touch least on one machine,</text><text x="28" y="332" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#7f849c" opacity="1">and the one you touch constantly on the other.</text></svg>