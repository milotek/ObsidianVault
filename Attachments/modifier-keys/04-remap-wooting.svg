th="1"/><text x="236.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#11111b" opacity="1">Ctrl</text><rect x="271.0" y="255" width="60.0" height="48" rx="6" fill="#cba6f7" stroke="#313244" stroke-width="1"/><text x="301.0" y="271.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#11111b" opacity="1">Cmd</text><text x="301.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="400" fill="#11111b" opacity="0.72">Win sends this</text><rect x="336.0" y="255" width="60.0" height="48" rx="6" fill="#94e2d5" stroke="#313244" stroke-width="1"/><text x="366.0" y="271.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#11111b" opacity="1">Option</text><text x="366.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="400" fill="#11111b" opacity="0.72">Alt sends this</text><rect x="401.0" y="255" width="216.0" height="48" rx="6" fill="#292c3c" stroke="#313244" stroke-width="1"/><text x="509.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#585b70" opacity="1">Space</text><text x="28.0" y="333.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#7f849c" opacity="1">Exactly one key changes. macOS already reads Win as Cmd and Alt as Option, so the bottom row needs nothing -</text><text x="28.0" y="353.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#7f849c" opacity="1">it just means something different the moment the board is plugged into the other machine.</text><text x="28.0" y="385.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#f9e2af" opacity="1">ringed in yellow = the keys you actually change</text></svg>