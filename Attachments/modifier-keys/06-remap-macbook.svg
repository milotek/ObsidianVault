" stroke="#313244" stroke-width="1"/><text x="229.5" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#585b70" opacity="1">fn</text><rect x="258.0" y="255" width="47.0" height="48" rx="6" fill="#f38ba8" stroke="#313244" stroke-width="1"/><text x="281.5" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.525345622119817" font-weight="400" fill="#11111b" opacity="1">Control</text><rect x="310.0" y="255" width="47.0" height="48" rx="6" fill="#cba6f7" stroke="#f9e2af" stroke-width="2.5"/><text x="333.5" y="271.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#11111b" opacity="1">Cmd</text><text x="333.5" y="287.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="400" fill="#11111b" opacity="0.72">was Option</text><rect x="362.0" y="255" width="60.0" height="48" rx="6" fill="#94e2d5" stroke="#f9e2af" stroke-width="2.5"/><text x="392.0" y="271.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#11111b" opacity="1">Option</text><text x="392.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="400" fill="#11111b" opacity="0.72">was Cmd</text><rect x="427.0" y="255" width="190.0" height="48" rx="6" fill="#292c3c" stroke="#313244" stroke-width="1"/><text x="522.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" font-weight="400" fill="#585b70" opacity="1">Space</text><text x="28.0" y="333.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#7f849c" opacity="1">Option and Cmd swap so the slot next to space stops being the important one, and caps picks up the job instead.</text><text x="28.0" y="365.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#f9e2af" opacity="1">ringed in yellow = the keys you actually change</text></svg>