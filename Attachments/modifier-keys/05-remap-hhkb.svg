the second Alt becomes the board's only real Ctrl.</text><text x="28.0" y="353.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#7f849c" opacity="1">It lives in the firmware rather than the host, so it works over Bluetooth on anything I pair it to.</text><text x="28.0" y="385.0" text-anchor="start" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#f9e2af" opacity="1">ringed in yellow = the keys you actually change</text></svg>